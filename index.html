<style>
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
:root{
  --ink:#14231f;--ink2:#46554f;--mute:#76837e;--bg:#f5f6f5;--card:#ffffff;--line:#dfe3e0;--line2:#eceeec;
  --teal:#0e625d;--teal2:#16847c;--tealbg:#e2f0ed;--sand:#c2832f;--sandbg:#fbf0df;
  --red:#b0412d;--redbg:#f8e3de;--green:#2b7a47;--greenbg:#e1f1e6;--amber:#9b6409;--amberbg:#fbeed3;--blue:#2b5b8c;--bluebg:#e1ebf5;
  --r:10px;--sh:none;
  --topbg:rgba(255,255,255,.94);--raise:#ffffff;--soft:#f5f6f5;--track:#e8ebe9;--chip:#eef0ee;--hover:#eef0ee;--field:#ffffff;--notefg:#6d4a17;--notetealfg:#0b4c48;--onink:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e5eeeb;--ink2:#a9bcb8;--mute:#80948f;--bg:#101614;--card:#161d1b;--line:#29332f;--line2:#1f2825;--teal:#1d8f85;--teal2:#25a397;--tealbg:#143430;--sand:#d4974a;--sandbg:#382a16;--red:#e5826d;--redbg:#3b1f19;--green:#6cc28a;--greenbg:#173020;--amber:#e0b25a;--amberbg:#372a10;--blue:#82b2e2;--bluebg:#18293b;--topbg:rgba(14,23,22,.9);--raise:#1d2a27;--soft:#1b2725;--track:#26342f;--chip:#1d2a27;--hover:#1f2d2a;--field:#1a2623;--notefg:#e9c48a;--notetealfg:#9fd8d1;--onink:#0e1716;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e5eeeb;--ink2:#a9bcb8;--mute:#80948f;--bg:#101614;--card:#161d1b;--line:#29332f;--line2:#1f2825;--teal:#1d8f85;--teal2:#25a397;--tealbg:#143430;--sand:#d4974a;--sandbg:#382a16;--red:#e5826d;--redbg:#3b1f19;--green:#6cc28a;--greenbg:#173020;--amber:#e0b25a;--amberbg:#372a10;--blue:#82b2e2;--bluebg:#18293b;--topbg:rgba(14,23,22,.9);--raise:#1d2a27;--soft:#1b2725;--track:#26342f;--chip:#1d2a27;--hover:#1f2d2a;--field:#1a2623;--notefg:#e9c48a;--notetealfg:#9fd8d1;--onink:#0e1716;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.lucide{width:18px;height:18px;stroke-width:2;flex-shrink:0}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1320px;margin:0 auto;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--teal);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px;letter-spacing:0}
.roles{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px;margin-left:auto}
.roles button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;white-space:nowrap}
.roles button.on{background:var(--raise);color:var(--teal);box-shadow:0 0 0 1px var(--line)}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.lang button{padding:7px 11px;font-weight:700;font-size:12.5px;color:var(--mute)}
.lang button.on{background:var(--ink);color:var(--onink)}
.mock{background:#14231f;color:#d8e7e4;font-size:12.5px;text-align:center;padding:6px 12px}
.mock b{color:#fff}
/* layout */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:236px 1fr;gap:24px;padding-block:24px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.shell>*{min-width:0}
.solo{max-width:1120px;margin:0 auto;padding-block:28px 70px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
aside{position:sticky;top:86px;align-self:start}
.who{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);margin-bottom:12px;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--sandbg);color:var(--sand);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.who b{display:block;font-size:14px;line-height:1.25}.who span{font-size:12px;color:var(--mute)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);text-align:left;width:100%}
nav button:hover{background:var(--hover)}
nav button.on{background:var(--teal);color:#fff}
nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px}
nav button.on .badge{background:#fff;color:var(--teal)}
/* type */

h2{font-size:21px;letter-spacing:-.015em;font-weight:800;margin-bottom:4px}
h3{font-size:15.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sub{color:var(--ink2);margin-bottom:20px}
.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph .sub{margin-bottom:0}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
.stack>*+*{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-green{background:var(--greenbg);color:var(--green)}.p-red{background:var(--redbg);color:var(--red)}.p-amber{background:var(--amberbg);color:var(--amber)}.p-blue{background:var(--bluebg);color:var(--blue)}.p-teal{background:var(--tealbg);color:var(--teal)}.p-grey{background:var(--track);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;background:var(--teal);color:#fff;white-space:nowrap}
.btn:hover{background:var(--teal2)}
.btn.ghost{background:var(--card);color:var(--teal);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tealbg)}
.btn.sand{background:var(--sand)}
.btn.sm{padding:7px 12px;font-size:13px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .d{font-size:12.5px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
.list>div{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.list>div:first-child{border-top:0;padding-top:2px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.i-teal{background:var(--tealbg);color:var(--teal)}.i-sand{background:var(--sandbg);color:var(--sand)}.i-red{background:var(--redbg);color:var(--red)}.i-blue{background:var(--bluebg);color:var(--blue)}.i-green{background:var(--greenbg);color:var(--green)}.i-amber{background:var(--amberbg);color:var(--amber)}
.grow{flex:1;min-width:0}
.list b{font-size:14px;display:block;line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;margin:0 -4px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);width:100%}
.field textarea{min-height:84px;resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center}
.note{background:var(--sandbg);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--notefg);display:flex;gap:10px}
.note.teal{background:var(--tealbg);color:var(--notetealfg)}
.note svg{margin-top:2px}
/* hero */
.hero{border-radius:var(--r);padding:40px;color:#fff;background:#0f3b37;position:relative;overflow:hidden}
.hero h1{font-size:34px;max-width:680px;text-wrap:balance}
.hero p{max-width:600px;color:#cfe5e1;margin-top:12px;font-size:16px}
.hero .row{margin-top:22px}
.hero .btn{background:#fff;color:var(--teal)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ripple{display:none}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.hero .eyebrow{color:#a9cfc9}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.qa button{background:var(--card);border-radius:var(--r);padding:14px 8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:12.5px;text-align:center}
.qa button:hover{border-color:var(--teal)}
/* steps */
.steps{display:flex;gap:4px;margin-top:10px}
.steps span{flex:1;height:5px;border-radius:5px;background:var(--track)}
.steps span.on{background:var(--teal)}
/* slots */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{min-width:58px;border:1px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--card);font-size:12px;font-weight:600;color:var(--ink2)}
.days button b{display:block;font-size:17px;color:var(--ink)}
.days button.on{background:var(--teal);border-color:var(--teal);color:#cfe9e5}
.days button.on b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.slots button{border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700;background:var(--card)}
.slots button.taken{background:var(--track);color:var(--mute);text-decoration:line-through;cursor:not-allowed}
.slots button.sel{background:var(--sand);border-color:var(--sand);color:#fff}
.fac{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.fac button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;font-weight:700;font-size:13.5px}
.fac button span{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.fac button.on{border-color:var(--teal);background:var(--tealbg)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--hover);border-radius:var(--r);padding:10px}
.col h4{font-size:13px;font-weight:800;padding:4px 6px 10px;display:flex;justify-content:space-between}
.tk{background:var(--card);border-radius:8px;padding:11px;margin-bottom:8px;border:1px solid var(--line);font-size:13px}
.tk b{display:block;font-size:13.5px;margin:3px 0 6px;line-height:1.35}
/* gauge */
.gauge{position:relative;height:18px;background:var(--track);border-radius:10px;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:10px}
.gauge .line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
/* chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px;overflow:hidden}
.chart>div{min-width:0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--teal)}
.chart i.b{background:var(--sand)}
.chart span{font-size:11px;color:var(--mute);font-weight:600}
.dual{display:flex;gap:3px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.dual i{max-width:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* toggles */
.tg{width:38px;height:22px;border-radius:20px;background:var(--teal);position:relative;flex-shrink:0}
.tg::after{content:'';position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tg.off{background:var(--line)}.tg.off::after{right:auto;left:3px}
/* proposal */
.tier{border-radius:var(--r);padding:22px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--tc);position:relative}
.tier h3{font-size:18px;margin-bottom:4px}
.tier ul{list-style:none;margin-top:12px;font-size:14px}
.tier li{padding:6px 0;display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line2);font-size:13.5px;color:var(--ink2)}
.tier li svg{width:15px;height:15px;margin-top:3px;color:var(--tc)}
.tier .who2{font-size:13px;color:var(--mute)}
.tier h3 svg{color:var(--tc)}
.t1{--tc:var(--sand)}
.t2{--tc:var(--teal2)}
.t3{--tc:var(--ink)}
.phase{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line2)}
.phase:first-child{border-top:0}
.phase .n{font-weight:800;color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--tealbg);color:var(--teal);font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:50;display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;color:var(--mute);font-size:12.5px;padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.status>div{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.qr{width:120px;height:120px;border-radius:12px;flex-shrink:0;background:
 conic-gradient(from 90deg at 30% 30%,#0f2e2c 25%,transparent 0) 0 0/24px 24px,
 repeating-linear-gradient(90deg,#0f2e2c 0 6px,transparent 6px 12px),#fff;border:8px solid #fff;outline:1px solid var(--line);opacity:.9}
@media (max-width:1060px){.g4{grid-template-columns:repeat(2,1fr)}.qa{grid-template-columns:repeat(3,1fr)}.fac{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;padding-top:12px}
  aside{position:static}
  .who{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  nav button{width:auto;white-space:nowrap;background:var(--card);border:1px solid var(--line)}
  .g2,.g3{grid-template-columns:1fr}.span2{grid-column:auto}
  .status{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .topin{flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .brand small{display:none}
  .roles{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none}
  .roles button{padding:7px 6px;flex:1;justify-content:center;font-size:13px}
  .roles button svg{display:none}
  .lang{margin-left:auto}
  .solo,.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hero{padding:26px 22px}.hero h1{font-size:27px}
  h1{font-size:24px}
  .g4{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:19px;overflow-wrap:anywhere}
  .phase{grid-template-columns:1fr;gap:4px}
  .slots{grid-template-columns:repeat(3,1fr)}
  .status{grid-template-columns:1fr}
  .card{padding:15px}
}
</style>
</head>
<body>
<div id="top"></div>
<div id="app"></div>
<div class="foot" id="foot"></div>
<div class="toast" id="toast"></div>
<script>
let LANG='id', ROLE='proposal';
const VIEW={proposal:'overview',public:'home',resident:'home',board:'dash'};
const t=(id,en)=>LANG==='id'?id:en;
const T=a=>Array.isArray(a)?t(a[0],a[1]):a;
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const ic=(n,c='')=>`<i data-lucide="${n}" class="${c}"></i>`;
const pill=(cls,txt)=>`<span class="pill p-${cls}">${txt}</span>`;

/* ---------- state (sample data only) ---------- */
let tickets=[
 {id:'FP-1042',cat:['Kebocoran','Leak'],title:['Rembesan air di plafon kamar mandi','Water seeping through bathroom ceiling'],step:2,date:'21 Nov',who:['Teknisi, Pak Hendra','Technician, Pak Hendra'],sla:['Target 48 jam · sisa 19 jam','48-hour target · 19 h left']},
 {id:'FP-1037',cat:['Lift','Lift'],title:['Tombol panggil lift B lantai 5 tidak menyala','Lift B call button on floor 5 not lit'],step:3,date:'18 Nov',who:['Vendor lift','Lift contractor'],sla:['Selesai dalam 31 jam','Closed in 31 h']},
 {id:'FP-1029',cat:['Kebersihan','Cleaning'],title:['Sampah menumpuk di area tangga darurat lt. 5','Rubbish piling up in fire stairs, floor 5'],step:3,date:'12 Nov',who:['Housekeeping','Housekeeping'],sla:['Selesai dalam 6 jam','Closed in 6 h']}
];
let poll=[{l:['Perbaikan kolam renang','Swimming pool repair'],v:31},{l:['Resurfacing jalan masuk & parkir','Driveway & car park resurfacing'],v:24},{l:['Lapangan tenis','Tennis court'],v:12},{l:['Tambah pengisian mobil listrik','More EV chargers'],v:19}];
let voted=false, fac=0, day=2, slot=null;

/* ---------- navigation ---------- */

function go(r,v){ROLE=r;if(v)VIEW[r]=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function setLang(l){LANG=l;render();}
function toast(m){const e=document.getElementById('toast');e.innerHTML=ic('check-circle-2')+m;window.lucide&&lucide.createIcons();e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600);}

function header(){
 return `<div class="top"><div class="topin">
 <div class="brand"><div class="logo">${ic('droplets')}</div><div>Fountain Park<small>Griya Pancoran · PPPSRS</small></div></div>
 <div class="roles">${ROLES.map(r=>`<button class="${ROLE===r[0]?'on':''}" onclick="go('${r[0]}')">${ic(r[1])}${t(r[2],r[3])}</button>`).join('')}</div>
 <div class="lang"><button class="${LANG==='id'?'on':''}" onclick="setLang('id')">ID</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button></div>
 </div><div class="mock"><b>${t('MOCK-UP','MOCK-UP')}</b>: ${t('semua nama, angka dan data di halaman ini adalah contoh, bukan data nyata Fountain Park.','all names, figures and data on these pages are samples, not real Fountain Park data.')}</div></div>`;
}
function side(){
 const w=ROLE==='resident'?['SW','Ibu Sari W.',t('Unit 5C · Pemilik','Unit 5C · Owner')]:['DA','Pak Dimas A.',t('Sekretaris PPPSRS','PPPSRS Secretary')];
 return `<aside><div class="who"><div class="av">${w[0]}</div><div><b>${w[1]}</b><span>${w[2]}</span></div></div>
 <nav>${NAV[ROLE].map(n=>`<button class="${VIEW[ROLE]===n[0]?'on':''}" onclick="go('${ROLE}','${n[0]}')">${ic(n[1])}${t(n[2],n[3])}${n[4]?`<span class="badge">${n[4]}</span>`:''}</button>`).join('')}</nav></aside>`;
}
function render(){
 document.documentElement.lang=LANG;
 document.getElementById('top').innerHTML=header();
 const body=V[ROLE][VIEW[ROLE]]();
 document.getElementById('app').innerHTML=(ROLE==='resident'||ROLE==='board')?`<div class="shell">${side()}<main>${body}</main></div>`:`<main class="solo">${body}</main>`;
 document.getElementById('foot').innerHTML=t('Mock-up portal untuk PPPSRS Fountain Park (Griya Pancoran), Pancoran, Jakarta Selatan · tidak ada data nyata · versi Nov 2026','Portal mock-up for the Fountain Park (Griya Pancoran) PPPSRS, Pancoran, South Jakarta · no real data · Nov 2026 version');
 window.lucide&&lucide.createIcons();
}
const head=(eb,h,s,right='')=>`<div class="ph"><div>${eb?`<div class="eyebrow">${eb}</div>`:''}<h1>${h}</h1>${s?`<p class="sub" style="margin-top:6px">${s}</p>`:''}</div>${right}</div>`;
